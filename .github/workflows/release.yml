name: Validate and release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: test -f plugins/polychat/dist/polychat-server.cjs
      - run: test -f plugins/polychat/dist/polychat-mcp.cjs
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            plugins/polychat/dist/polychat-server.cjs
            plugins/polychat/dist/polychat-mcp.cjs
